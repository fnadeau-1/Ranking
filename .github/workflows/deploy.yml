name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Lint functions
        run: npm run lint
        working-directory: functions

      # Requires a repo secret FIREBASE_TOKEN, generated locally with:
      #   firebase login:ci
      # See README "Continuous deployment" for the one-time setup.
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v13.19.0
        with:
          args: deploy --only hosting,firestore:rules,firestore:indexes,functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
